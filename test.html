
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Expense</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  background: #f2f1f6;
  min-height: 100vh;
  display: grid;
  place-items: center;
  color: #24232b;
}

button, input { font: inherit; }

.open-btn, .save-btn {
  border: 0;
  background: #6855b8;
  color: white;
  padding: 13px 22px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 600;
}

/* Modal */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(20, 18, 30, .48);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 10;
}

.overlay.active { display: flex; }

.modal {
  background: white;
  width: 100%;
  max-width: 470px;
  max-height: 90vh;
  border-radius: 22px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 20px 70px #0002;
}

.modal-header {
  padding: 22px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #eee;
}

.modal-header h2 {
  font-size: 20px;
  margin: 0;
}

.close-btn {
  background: #f3f2f6;
  border: 0;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 20px;
}

.modal-body {
  padding: 22px 24px;
  overflow-y: auto;
  min-height: 0;
}

.field { margin-bottom: 22px; }

.field label, .category-heading {
  display: block;
  font-size: 13px;
  font-weight: 650;
  margin-bottom: 9px;
}

.field input {
  width: 100%;
  padding: 14px;
  border: 1px solid #e6e3ed;
  border-radius: 12px;
  outline: none;
  font-size: 15px;
  background: #fff;
}

.field input:focus, .search-input:focus,
.custom-input:focus {
  border-color: #8b77d2;
  box-shadow: 0 0 0 3px #8b77d21a;
}

.category-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.category-heading { margin: 0; }

.search-input {
  width: 100%;
  border: 1px solid #e6e3ed;
  padding: 11px 13px;
  border-radius: 11px;
  margin-bottom: 12px;
  outline: none;
  display: none;
}

.search-input.visible { display: block; }

/* Scrollable capsule area */
.category-scroll {
  max-height: 175px;
  overflow-y: auto;
  padding: 2px 3px 8px 0;
}

.capsules {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: flex-start;
}

.capsule {
  border: 1px solid #ece9f2;
  background: #faf9fc;
  color: #55515e;
  border-radius: 30px;
  padding: 10px 15px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 550;
  transition: .2s;
  white-space: nowrap;
}

.capsule:hover {
  background: #f0edfa;
  border-color: #c6b9e9;
}

.capsule.selected {
  background: #eee9ff;
  color: #624caf;
  border-color: #8e79d0;
}

/* Add custom category */
.add-capsule {
  border: 1px dashed #9b88d4;
  color: #725cb9;
  background: white;
}

.custom-row {
  display: none;
  gap: 8px;
  margin-top: 13px;
}

.custom-row.visible { display: flex; }

.custom-input {
  min-width: 0;
  flex: 1;
  padding: 11px;
  border: 1px solid #e6e3ed;
  border-radius: 10px;
  outline: none;
}

.add-confirm {
  background: #6855b8;
  color: white;
  border: 0;
  border-radius: 10px;
  padding: 0 15px;
  cursor: pointer;
}

.cancel-custom {
  border: 0;
  background: #f1eff5;
  border-radius: 10px;
  cursor: pointer;
  padding: 0 12px;
}

.empty {
  color: #9993a4;
  font-size: 13px;
  padding: 12px 0;
}

.error {
  color: #c64e55;
  font-size: 12px;
  margin-top: 7px;
  display: none;
}

.modal-footer {
  padding: 16px 24px 22px;
  border-top: 1px solid #eee;
  background: white;
}

.save-btn {
  width: 100%;
}

@media (max-width: 500px) {
  .modal {
    max-height: 88vh;
    border-radius: 20px;
  }
  .modal-body { padding: 20px; }
  .modal-header, .modal-footer { padding-left: 20px; padding-right: 20px; }
}
</style>
</head>

<body>

<button class="open-btn" onclick="openModal()">
  + Add Expense
</button>

<div class="overlay" id="overlay">
  <div class="modal">

    <div class="modal-header">
      <h2>Add expense</h2>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>

    <div class="modal-body">

      <div class="field">
        <label for="expenseName">Expense name</label>
        <input id="expenseName" placeholder="e.g. Lunch, Groceries, Uber">
      </div>

      <div class="field">
        <label for="amount">Amount</label>
        <input id="amount" type="number" min="0.01"
          step="0.01" placeholder="Enter amount">
      </div>

      <div class="category-top">
        <span class="category-heading">Choose category</span>
        <small id="categoryCount" style="color:#999"></small>
      </div>

      <input
        id="search"
        class="search-input"
        placeholder="Search categories..."
        oninput="renderCategories()"
      >

      <div class="category-scroll">
        <div class="capsules" id="capsules"></div>
        <div class="empty" id="empty" style="display:none">
          No categories found.
        </div>
      </div>

      <div class="custom-row" id="customRow">
        <input
          id="customInput"
          class="custom-input"
          placeholder="New category name"
          maxlength="30"
        >
        <button class="add-confirm" onclick="addCategory()">✓</button>
        <button class="cancel-custom" onclick="cancelCustom()">×</button>
      </div>

      <div class="error" id="error"></div>

    </div>

    <div class="modal-footer">
      <button class="save-btn" onclick="saveExpense()">
        Save expense
      </button>
    </div>

  </div>
</div>

<script>
const defaultCategories = [
  "🍔 Food",
  "🛍 Shopping",
  "🚗 Transport",
  "🏠 Home",
  "💊 Health",
  "🎬 Entertainment",
  "📚 Education",
  "✈️ Travel"
];

let categories = [...defaultCategories];
let selectedCategory = null;

const overlay = document.getElementById("overlay");
const capsules = document.getElementById("capsules");
const search = document.getElementById("search");
const customRow = document.getElementById("customRow");
const customInput = document.getElementById("customInput");

function openModal() {
  overlay.classList.add("active");
  renderCategories();
}

function closeModal() {
  overlay.classList.remove("active");
}

function renderCategories() {
  capsules.innerHTML = "";

  const query = search.value.trim().toLowerCase();

  const filtered = categories.filter(category =>
    category.toLowerCase().includes(query)
  );

  document.getElementById("categoryCount").textContent =
    categories.length + " categories";

  // Show search only when there are more than 8 categories
  search.classList.toggle("visible", categories.length > 8);

  filtered.forEach(category => {
    const button = document.createElement("button");

    button.className =
      "capsule" +
      (selectedCategory === category ? " selected" : "");

    button.textContent = category;

    button.onclick = () => {
      selectedCategory = category;
      renderCategories();
    };

    capsules.appendChild(button);
  });

  document.getElementById("empty").style.display =
    filtered.length ? "none" : "block";

  // Add button stays available at the end
  const addButton = document.createElement("button");
  addButton.className = "capsule add-capsule";
  addButton.textContent = "+ Add new";
  addButton.onclick = showCustomInput;

  capsules.appendChild(addButton);
}

function showCustomInput() {
  customRow.classList.add("visible");
  customInput.focus();
}

function cancelCustom() {
  customRow.classList.remove("visible");
  customInput.value = "";
}

function addCategory() {
  const name = customInput.value.trim();

  if (!name) {
    customInput.focus();
    return;
  }

  const exists = categories.some(
    category => category.toLowerCase() === name.toLowerCase()
  );

  if (exists) {
    customInput.setCustomValidity("Category already exists");
    customInput.reportValidity();
    return;
  }

  const newCategory = name;

  categories.push(newCategory);
  selectedCategory = newCategory;

  customInput.setCustomValidity("");
  customInput.value = "";
  cancelCustom();

  search.value = "";
  renderCategories();
}

customInput.addEventListener("keydown", event => {
  if (event.key === "Enter") addCategory();
  if (event.key === "Escape") cancelCustom();
});

function saveExpense() {
  const name = document.getElementById("expenseName").value.trim();
  const amount = Number(document.getElementById("amount").value);
  const error = document.getElementById("error");

  if (!name || !Number.isFinite(amount) ||
      amount <= 0 || !selectedCategory) {
    error.textContent = "Please enter a name, valid amount and category.";
    error.style.display = "block";
    return;
  }

  error.style.display = "none";

  const expense = {
    name,
    amount,
    category: selectedCategory
  };

  console.log("Expense saved:", expense);

  alert(
    "Expense saved!\n" +
    expense.name + " - " + expense.amount +
    "\nCategory: " + expense.category
  );

  closeModal();
}

overlay.addEventListener("click", event => {
  if (event.target === overlay) closeModal();
});

renderCategories();
</script>

</body>
</html>
